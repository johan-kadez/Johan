<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produk - Johan Service</title>
<meta name="description" content="Produk Johan Service.">
<link rel="stylesheet" href="/style.css">
<style>
.product-page{max-width:1100px;margin:0 auto;padding:32px 18px 70px}.product-page .back{display:inline-block;margin-bottom:22px;text-decoration:none}.product-detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:28px;align-items:start}.product-gallery,.product-info{background:rgba(10,12,18,.78);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px}.product-gallery>img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:13px}.product-info h1{margin:6px 0 10px;font-size:clamp(28px,5vw,48px)}.product-id,.description,.spec p{opacity:.82;line-height:1.6}.product-price{font-size:24px;font-weight:800;margin:18px 0}.price-old{text-decoration:line-through;opacity:.55;margin-right:8px}.order-btn{display:inline-block;margin-top:18px;text-decoration:none}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:10px}.thumbs img{width:72px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer}@media(max-width:760px){.product-detail{grid-template-columns:1fr}.product-page{padding-top:20px}}
</style>
</head>
<body>
<header class="site-header"><a class="brand" href="/"><span class="brand-logo-wrap"><img id="brandLogo" src="https://i.imgur.com/RSHWPkm.png" alt="Logo"></span><span>Johan<span> Service</span></span></a></header>
<div id="app"><main class="product-page"><p>Memuat produk...</p></main></div>
<script type="module" src="/product.js"></script>
</body>
</html>
