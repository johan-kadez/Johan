<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUXURYCPM Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080807;color:#eee8dd;font-family:Arial,sans-serif}.hidden{display:none!important}button,input,select{font:inherit}button{cursor:pointer}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#241b0a,#080807 48%)}.card{width:min(410px,100%);padding:28px;border:1px solid #3b301b;border-radius:20px;background:#0e0d09}.logo{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;background:#17130b;color:#e2b85e;font-weight:900}.eyebrow{font-size:10px;letter-spacing:4px;color:#d7ad58;font-weight:800}.card h1{font-family:Georgia,serif;font-size:38px}.card input,.panel input,.panel select{width:100%;padding:12px;margin:7px 0;background:#090908;color:#fff;border:1px solid #3a301f;border-radius:10px}.primary{width:100%;padding:12px;border:0;border-radius:10px;background:#bd9340;color:#0b0905;font-weight:900}
.app{display:flex;min-height:100vh}.side{width:230px;border-right:1px solid #29251b;background:#0b0a08;padding:18px;display:flex;flex-direction:column}.brand{color:#e3b961;font-weight:900;letter-spacing:4px;margin-bottom:30px}.nav{display:grid;gap:5px}.nav button,.logout{border:0;background:transparent;color:#8f8a80;padding:12px;border-radius:10px;text-align:left}.nav button.active,.nav button:hover{background:#19150c;color:#e0b65b}.logout{margin-top:auto;border:1px solid #30291d}.main{flex:1;max-width:1200px;padding:25px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.pages{display:none}.pages.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.panel{border:1px solid #2d281d;background:#0e0d0a;border-radius:14px;padding:17px;margin-top:12px}.stat{border:1px solid #2d281d;background:#0e0d0a;border-radius:14px;padding:17px}.stat strong{display:block;font-size:26px;color:#e1b85d;margin-top:6px}.toolbar{display:flex;gap:10px}.toolbar input{flex:1}.car-row{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;border:1px solid #29251b;background:#0d0c09;padding:10px;border-radius:12px;margin-top:8px}.thumb{height:55px;border-radius:9px;background:#211b0d;display:grid;place-items:center;color:#bd9340}.row button{border:1px solid #4a3a20;background:#151108;color:#d8b25f;border-radius:8px;padding:8px}.contacts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:800px){.side{width:65px;padding:10px}.side .brand span,.nav button span,.logout span{display:none}.nav button,.logout{text-align:center}.main{padding:14px}.stats{grid-template-columns:1fr 1fr}.contacts{grid-template-columns:1fr}}
@media(max-width:480px){.stats{grid-template-columns:1fr 1fr}.car-row{grid-template-columns:55px 1fr}.row{grid-column:1/-1}}
</style></head>
<body>
<div id="login" class="login"><div class="card"><div class="logo">LC</div><p class="eyebrow">LUXURYCPM</p><h1>Admin Panel</h1><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button class="primary" onclick="login()">Masuk</button></div></div>
<div id="app" class="app hidden">
<aside class="side"><div class="brand">LC <span>LUXURYCPM</span></div><div class="nav">
<button class="active" onclick="page('dash',this)">⌂ <span>Dashboard</span></button><button onclick="page('manage',this)">🚗 <span>Produk</span></button><button onclick="page('contact',this)">♧ <span>CS & Social</span></button>
</div><button class="logout" onclick="location.href='/'">↩ <span>Store</span></button></aside>
<main class="main"><div class="head"><div><p class="eyebrow">ADMIN PANEL</p><h1 id="title">Dashboard</h1></div></div>
<section id="dash" class="pages active"><div class="stats"><div class="stat">Total Produk<strong id="total">0</strong></div><div class="stat">Tersedia<strong id="available">0</strong></div></div><div class="panel"><p class="eyebrow">LUXURYCPM</p><h2>Kelola marketplace dari panel ini.</h2></div></section>
<section id="manage" class="pages"><div class="toolbar"><input id="search" class="panel" placeholder="Cari produk..." oninput="render()"><button class="primary" style="width:auto;padding:12px 18px" onclick="openForm()">+ Produk</button></div><div id="list"></div></section>
<section id="contact" class="pages"><div class="contacts"><div class="panel"><p class="eyebrow">CS</p><input id="wa" placeholder="WhatsApp"><input id="tg" placeholder="Telegram"><button class="primary" onclick="saveContact()">Simpan</button></div><div class="panel"><p class="eyebrow">SOCIAL</p><input id="tt" placeholder="TikTok"><input id="yt" placeholder="YouTube"><button class="primary" onclick="saveContact()">Simpan</button></div></div></section>
</main></div>
<div id="modal" class="login hidden"><div class="card"><p class="eyebrow">PRODUK</p><input id="name" placeholder="Nama produk"><input id="price" type="number" placeholder="Harga"><select id="type"><option value="sport">CPM 1</option><option value="jdm">CPM 2</option><option value="luxury">Jasa</option></select><input id="image" placeholder="URL foto"><select id="status"><option value="available">Tersedia</option><option value="sold">Habis</option></select><button class="primary" onclick="saveProduct()">Simpan</button><button onclick="modal.classList.add('hidden')" style="width:100%;margin-top:8px;padding:10px;background:transparent;color:#aaa;border:1px solid #30291d;border-radius:9px">Batal</button></div></div>
<script>
let cars=JSON.parse(localStorage.getItem("ic_cars")||"null")||[
{id:1,name:"Nissan GT-R R35",price:35000,type:"sport",image:"",status:"available"},{id:2,name:"Toyota Supra MK4",price:30000,type:"jdm",image:"",status:"available"},{id:3,name:"BMW M4",price:40000,type:"luxury",image:"",status:"available"}];
let contact=JSON.parse(localStorage.getItem("ic_contact")||"null")||{wa:"6281234567890",tg:"#",tt:"#",yt:"#"};let editing=null;
function login(){if(user.value==="Insshop94"&&pass.value==="dafa112211"){loginEl();}else alert("Username atau password salah.")}
function loginEl(){login.classList.add("hidden");app.classList.remove("hidden");render()}
function page(id,btn){document.querySelectorAll(".pages").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");title.textContent=id==="dash"?"Dashboard":id==="manage"?"Produk":"CS & Social";render();apply()}
function render(){total.textContent=cars.length;available.textContent=cars.filter(x=>x.status==="available").length;if(!manage.classList.contains("active"))return;const q=(search.value||"").toLowerCase();list.innerHTML=cars.filter(x=>x.name.toLowerCase().includes(q)).map(c=>`<div class="car-row"><div class="thumb">CPM</div><div><b>${c.name}</b><small style="display:block;color:#777">${c.price} • ${c.type}</small></div><div class="row"><button onclick="edit(${c.id})">Edit</button><button onclick="del(${c.id})">Hapus</button></div></div>`).join("")}
function openForm(){editing=null;name.value="";price.value="";image.value="";type.value="sport";status.value="available";modal.classList.remove("hidden")}
function edit(id){const c=cars.find(x=>x.id===id);editing=id;name.value=c.name;price.value=c.price;image.value=c.image;type.value=c.type;status.value=c.status;modal.classList.remove("hidden")}
function saveProduct(){const c={id:editing||Date.now(),name:name.value.trim(),price:Number(price.value),image:image.value.trim(),type:type.value,status:status.value};if(!c.name||!c.price)return alert("Nama dan harga wajib diisi");cars=editing?cars.map(x=>x.id===editing?c:x):[c,...cars];localStorage.setItem("ic_cars",JSON.stringify(cars));modal.classList.add("hidden");render()}
function del(id){if(confirm("Hapus produk?")){cars=cars.filter(x=>x.id!==id);localStorage.setItem("ic_cars",JSON.stringify(cars));render()}}
function apply(){wa.value=contact.wa;tg.value=contact.tg;tt.value=contact.tt;yt.value=contact.yt}
function saveContact(){contact={wa:wa.value.trim(),tg:tg.value.trim(),tt:tt.value.trim(),yt:yt.value.trim()};localStorage.setItem("ic_contact",JSON.stringify(contact));alert("CS & Social tersimpan")}
</script></body></html>
