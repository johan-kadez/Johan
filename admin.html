<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Johan Service</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="admin-page">
<header class="site-header">
  <a class="brand" href="/">
    <span class="brand-logo-wrap">
      <img id="brandLogo" src="file_000000001b9c81fab0ec2d7de149437b.png" alt="Logo">
    </span><span>Johan<span> Service</span></span></a>
  <nav><a href="/">Store</a><button id="logout" class="hidden">Logout</button></nav>
</header>
<main class="admin-main">
  <div id="login" class="login panel">
    <p class="eyebrow">ADMIN ACCESS</p><h1>Admin Store</h1>
    <form id="loginForm"><input id="email" type="email" required placeholder="Email admin"><input id="password" type="password" required placeholder="Password"><button class="gold-btn">Login</button></form>
  </div>
  <div id="adminPanel" class="hidden">
    <h1>Dashboard</h1>
    <div class="panel">
      <div class="admin-tabs"><button class="admin-tab active" data-form="carForm">Tambah Mobil</button><button class="admin-tab" data-form="serviceForm">Tambah Jasa</button></div>
      <form id="carForm" class="admin-form">
        <input id="carName" required placeholder="Nama Mobil"><select id="carCategory" required><option value="cpm1">CPM 1</option><option value="cpm2">CPM 2</option></select>
        <textarea id="carSpec" required placeholder="Specification"></textarea><input id="carPrice" type="number" min="0" required placeholder="Harga"><input id="carStock" type="number" min="0" required placeholder="Stok">
        <input id="carImage" placeholder="URL/path gambar dari repo"><select id="carActive"><option value="true">Aktif</option><option value="false">Nonaktif</option></select><button class="gold-btn">Simpan Mobil</button>
      </form>
      <form id="serviceForm" class="admin-form hidden"><input id="serviceName" required placeholder="Nama Jasa"><input id="serviceImage" placeholder="URL/path gambar dari repo"><textarea id="serviceDescription" required placeholder="Deskripsi jasa"></textarea><input id="servicePrice" type="number" min="0" placeholder="Harga (opsional)"><select id="serviceActive"><option value="true">Aktif</option><option value="false">Nonaktif</option></select><button class="gold-btn">Simpan Jasa</button></form>
    </div>
    <div class="panel"><p class="eyebrow">CATALOG</p><h2>Mobil</h2><div class="table-wrap"><table><thead><tr><th>Nama Mobil</th><th>Kategori</th><th>Specification</th><th>Harga</th><th>Stok</th><th>Status</th><th></th></tr></thead><tbody id="cars"></tbody></table></div></div>
    <div class="panel"><p class="eyebrow">SERVICE</p><h2>Jasa</h2><div class="table-wrap"><table><thead><tr><th>Nama Jasa</th><th>Deskripsi</th><th>Harga</th><th>Status</th><th></th></tr></thead><tbody id="services"></tbody></table></div></div>
    <div class="panel"><p class="eyebrow">ORDERS</p><h2>Pesanan</h2><div class="table-wrap"><table><thead><tr><th>Pelanggan</th><th>WA</th><th>Produk/Jasa</th><th>Status</th></tr></thead><tbody id="orders"></tbody></table></div></div>
  </div>
</main>
<div id="sitePopup" class="site-popup hidden" role="dialog" aria-modal="true" aria-live="polite"><div class="popup-card"><button id="popupClose" class="popup-close" type="button">×</button><div class="popup-icon" id="popupIcon">i</div><p class="eyebrow" id="popupEyebrow">NOTICE</p><h3 id="popupTitle">Pemberitahuan</h3><p id="popupMessage"></p><button id="popupAction" class="gold-btn popup-action hidden" type="button">OK</button></div></div>
<script type="module" src="/admin.js"></script>
</body>
</html>
