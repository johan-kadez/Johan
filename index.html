<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Johan Service</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="site-header">
  <a class="brand" href="/">
    <span class="brand-logo-wrap"><img id="brandLogo" class="brand-logo hidden" alt="Luxury CPM logo"></span>
    <span>Johan<span>Service</span></span>
  </a>
  <nav><a href="#products">Produk</a><a href="#categories">Kategori</a></nav>
</header>

<section class="hero">
  <div>
    <p class="eyebrow">CAR PARKING MULTIPLAYER</p>
    <h1>Dilihat Gatumbang.<br><i>Dibeli Makasih Bang.</i></h1>
    <p>Marketplace eksklusif untuk mobil CPM dan jasa pilihan.</p>
    <a class="gold-btn" href="#products">Jelajahi Store</a>
  </div>
</section>

<section id="categories" class="section category-section">
  <div class="section-title"><p class="eyebrow">EXPLORE</p><h2>Kategori</h2></div>
  <div class="cats" id="categoryBar">
    <button class="active" data-cat="all">Semua</button>
    <button data-cat="cpm1">CPM 1</button>
    <button data-cat="cpm2">CPM 2</button>
    <button data-cat="jasa">Jasa</button>
  </div>
</section>

<section id="products" class="section products-section">
  <div class="toolbar">
    <div><p class="eyebrow">COLLECTION</p><h2>Produk pilihan</h2></div>
    <div class="search-shell" id="searchShell">
      <input id="search" type="search" autocomplete="off" placeholder="Cari produk..." aria-label="Cari produk">
      <button id="clearSearch" class="search-clear hidden" type="button" aria-label="Hapus pencarian">×</button>
      <span class="search-icon" aria-hidden="true">⌕</span>
    </div>
  </div>
  <div id="grid" class="grid"></div>
</section>

<div id="sitePopup" class="site-popup hidden" role="dialog" aria-modal="true" aria-live="polite">
  <div class="popup-card">
    <button id="popupClose" class="popup-close" type="button">×</button>
    <div class="popup-icon" id="popupIcon">✓</div>
    <p class="eyebrow" id="popupEyebrow">NOTICE</p>
    <h3 id="popupTitle">Pemberitahuan</h3>
    <p id="popupMessage"></p>
    <button id="popupAction" class="gold-btn popup-action hidden" type="button">OK</button>
  </div>
</div>

<script type="module" src="/store.js"></script>
</body>
</html>
