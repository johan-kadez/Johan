<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luxury CPM Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="brand" href="/">LUXURY<span>CPM</span></a>
  <nav>
    <a href="#products">Produk</a>
    <a href="#categories">Kategori</a>
  </nav>
</header>

<section class="hero">
  <div>
    <p class="eyebrow">CAR PARKING MULTIPLAYER</p>
    <h1>Premium Cars.<br><i>Premium Service.</i></h1>
    <p>Marketplace eksklusif untuk mobil CPM dan jasa pilihan.</p>
    <a class="gold-btn" href="#products">Jelajahi Store</a>
  </div>
</section>

<section id="categories" class="section">
  <div class="section-title">
    <p class="eyebrow">EXPLORE</p>
    <h2>Kategori</h2>
  </div>
  <div class="cats">
    <button class="active" data-cat="all">Semua</button>
    <button data-cat="cpm1">CPM 1</button>
    <button data-cat="cpm2">CPM 2</button>
    <button data-cat="jasa">Jasa</button>
  </div>
</section>

<section id="products" class="section">
  <div class="toolbar">
    <div>
      <p class="eyebrow">COLLECTION</p>
      <h2>Produk pilihan</h2>
    </div>
    <input id="search" placeholder="Cari produk...">
  </div>
  <div id="grid" class="grid"></div>
</section>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <button id="closeModal" class="close">×</button>
    <p class="eyebrow">ORDER</p>
    <h2 id="orderTitle">Pesan Produk</h2>
    <form id="orderForm">
      <input id="customerName" required placeholder="Nama">
      <input id="phone" required placeholder="WhatsApp">
      <textarea id="address" required placeholder="Detail pesanan / alamat"></textarea>
      <input id="selectedProduct" type="hidden">
      <button class="gold-btn">Kirim Pesanan</button>
    </form>
  </div>
</div>

<footer>LUXURY CPM STORE · Premium CPM Marketplace</footer>
<script type="module" src="store.js"></script>
</body>
</html>
